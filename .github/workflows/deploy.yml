name: Build data & publish app

# Refreshes the stats snapshots from ESPN every 2 hours and publishes the app to GitHub Pages.
# Works with either Pages setting (Settings -> Pages -> Source):
#   - "GitHub Actions"                       -> the deploy job below publishes it
#   - "Deploy from a branch" -> gh-pages /root -> the gh-pages push publishes it
# Live scores in the app come straight from ESPN, so they stay current between runs.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      # box scores are cached between runs so each run only downloads new games
      - name: Restore ESPN cache
        uses: actions/cache/restore@v4
        with:
          path: data/espn-cache
          key: espn-${{ github.run_id }}
          restore-keys: espn-

      - name: Build stats snapshots
        run: npm run data

      - name: Save ESPN cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/espn-cache
          key: espn-${{ github.run_id }}

      - name: Build app
        run: npm run build

      - name: Publish to gh-pages (single commit, no history growth)
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Used when Settings -> Pages -> Source is "GitHub Actions". If Pages is set to a branch
  # instead, this step is skipped over (the gh-pages push above already published the app).
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
